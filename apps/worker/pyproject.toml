[project]
name = "worker"
version = "0.1.0"
description = "Clip Studio worker: job queue, pipeline, FFmpeg render, scheduler"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
