# Only the worker runs locally; Supabase and R2 are hosted (see docs/env.md).
services:
  worker:
    build: ./apps/worker
    env_file:
      - path: apps/worker/.env
        required: false
    # Docker Desktop's default resolver fails on some Macs; use public DNS.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
